<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海克斯大乱斗攻略站 - ARAM Mayhem</title>
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-card: #1a1a28;
  --bg-card-hover: #222236;
  --border: #2a2a3e;
  --text-primary: #e8e8f0;
  --text-secondary: #9a9ab0;
  --text-muted: #6a6a80;
  --gold: #c8aa6e;
  --gold-light: #f0e6d2;
  --gold-dark: #8b6914;
  --tier-s: #ff4e50;
  --tier-a: #ff8c42;
  --tier-b: #7b68ee;
  --tier-c: #4ecdc4;
  --tier-d: #6a6a80;
  --hex-blue: #0ac8b8;
  --hex-purple: #a855f7;
  --hex-gold: #eab308;
  --hex-silver: #94a3b8;
  --radius: 8px;
  --radius-lg: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(200,170,110,0.06) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 100%, rgba(10,200,184,0.04) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

.container { max-width: 1200px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }

.header {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 16px 0;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}

.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 20px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 1px;
}

.logo-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, var(--gold-dark), var(--gold));
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

.nav-tabs { display: flex; gap: 4px; }

.nav-tab {
  padding: 8px 18px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
}

.nav-tab:hover { color: var(--text-primary); background: var(--bg-card); }
.nav-tab.active { color: var(--gold); background: rgba(200,170,110,0.1); }

.search-wrap { position: relative; width: 240px; }

.search-input {
  width: 100%;
  padding: 8px 14px 8px 36px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-primary);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}

.search-input:focus { border-color: var(--gold); }
.search-input::placeholder { color: var(--text-muted); }

.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 14px;
}

.hero-banner {
  text-align: center;
  padding: 48px 0 32px;
}

.hero-banner h1 {
  font-size: 36px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}

.hero-banner .subtitle {
  color: var(--text-secondary);
  font-size: 15px;
}

.version-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  background: rgba(200,170,110,0.15);
  color: var(--gold);
  font-size: 12px;
  font-weight: 600;
  margin-left: 8px;
}

.section { margin-bottom: 40px; }

.section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}

.section-header h2 {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
}

.section-header .count {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 400;
}

.tier-grid { display: flex; flex-direction: column; gap: 6px; }

.tier-row {
  display: flex;
  align-items: stretch;
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--bg-card);
  border: 1px solid var(--border);
}

.tier-label {
  width: 56px;
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 800;
  flex-shrink: 0;
}

.tier-label.splus { background: rgba(255,215,0,0.25); color: #ffd700; }
.tier-label.s { background: rgba(255,78,80,0.2); color: var(--tier-s); }
.tier-label.a { background: rgba(255,140,66,0.2); color: var(--tier-a); }
.tier-label.b { background: rgba(123,104,238,0.2); color: var(--tier-b); }
.tier-label.c { background: rgba(78,205,196,0.2); color: var(--tier-c); }
.tier-label.d { background: rgba(106,106,128,0.2); color: var(--tier-d); }

.tier-champions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 14px;
  align-items: center;
}

.champion-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 6px;
  background: var(--bg-secondary);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 13px;
  font-weight: 500;
}

.champion-chip:hover {
  border-color: var(--gold);
  background: var(--bg-card-hover);
  transform: translateY(-1px);
}

.champion-chip .champ-icon {
  width: 28px;
  height: 28px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
}

.champion-chip .champ-name { white-space: nowrap; }
.champion-chip .champ-role {
  font-size: 11px;
  color: var(--text-muted);
  margin-left: 2px;
}

.champion-chip .champ-wr {
  font-size: 11px;
  color: var(--gold);
  margin-left: 2px;
  font-weight: 600;
}

.augment-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 14px;
}

.augment-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px;
  transition: all 0.2s;
  cursor: default;
}

.augment-card:hover {
  border-color: var(--hex-blue);
  background: var(--bg-card-hover);
}

.augment-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 10px;
}

.augment-icon {
  width: 44px;
  height: 44px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}

.augment-icon.prismatic { background: linear-gradient(135deg, #7c3aed, #a78bfa); }
.augment-icon.gold { background: linear-gradient(135deg, #b45309, #f59e0b); }
.augment-icon.silver { background: linear-gradient(135deg, #475569, #94a3b8); }

.augment-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
}

.augment-tier-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
  display: inline-block;
  margin-top: 2px;
}

.augment-tier-badge.prismatic { background: rgba(168,85,247,0.2); color: var(--hex-purple); }
.augment-tier-badge.gold { background: rgba(234,179,8,0.2); color: var(--hex-gold); }
.augment-tier-badge.silver { background: rgba(148,163,184,0.2); color: var(--hex-silver); }

.augment-desc {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 10px;
  line-height: 1.5;
}

.augment-heroes {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.augment-hero-tag {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 12px;
  background: rgba(200,170,110,0.1);
  color: var(--gold);
  cursor: pointer;
  transition: all 0.2s;
}

.augment-hero-tag:hover { background: rgba(200,170,110,0.25); }

.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}

.modal-overlay.active { opacity: 1; pointer-events: auto; }

.modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  width: 90%;
  max-width: 700px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: var(--shadow);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg-secondary);
  z-index: 1;
}

.modal-champ-info { display: flex; align-items: center; gap: 12px; }

.modal-champ-icon {
  width: 48px;
  height: 48px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 700;
}

.modal-champ-name { font-size: 20px; font-weight: 700; }
.modal-champ-title { font-size: 13px; color: var(--text-muted); }

.modal-close {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.modal-close:hover { color: var(--text-primary); border-color: var(--text-muted); }

.modal-body { padding: 24px; }

.modal-section { margin-bottom: 24px; }
.modal-section:last-child { margin-bottom: 0; }

.modal-section h3 {
  font-size: 15px;
  font-weight: 700;
  color: var(--gold);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.item-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.item-slot {
  width: 40px;
  height: 40px;
  border-radius: 6px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--text-secondary);
  text-align: center;
  line-height: 1.2;
  cursor: default;
  transition: all 0.2s;
}

.item-slot:hover { border-color: var(--gold); color: var(--text-primary); }
.item-slot.boots { border-color: rgba(200,170,110,0.4); }

.rune-tree { display: flex; gap: 12px; flex-wrap: wrap; }

.rune-primary, .rune-secondary { flex: 1; min-width: 200px; }

.rune-primary h4, .rune-secondary h4 {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.rune-list { display: flex; flex-direction: column; gap: 4px; }

.rune-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-radius: 4px;
  background: var(--bg-card);
  font-size: 13px;
}

.rune-item .rune-icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}

.rune-item .rune-icon.keystone { background: rgba(200,170,110,0.2); color: var(--gold); }
.rune-item .rune-icon.normal { background: var(--bg-secondary); color: var(--text-muted); }

.skill-order {
  display: flex;
  gap: 6px;
  font-size: 13px;
  font-family: monospace;
  color: var(--text-secondary);
}

.skill-order span { color: var(--gold); font-weight: 600; }

.augment-recs { display: flex; flex-direction: column; gap: 8px; }

.augment-rec-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 6px;
  background: var(--bg-card);
  border: 1px solid var(--border);
}

.augment-rec-item .rec-priority {
  font-size: 12px;
  font-weight: 700;
  color: var(--gold);
  min-width: 28px;
}

.augment-rec-item .rec-name { font-size: 14px; font-weight: 600; }
.augment-rec-item .rec-desc { font-size: 12px; color: var(--text-muted); margin-left: auto; }

.tips-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}

.tip-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px;
}

.tip-card h3 {
  font-size: 15px;
  font-weight: 700;
  color: var(--hex-blue);
  margin-bottom: 8px;
}

.tip-card p {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
}

.footer {
  text-align: center;
  padding: 32px 0;
  border-top: 1px solid var(--border);
  margin-top: 40px;
}

.footer p { font-size: 13px; color: var(--text-muted); }

@media (max-width: 768px) {
  .header-inner { flex-wrap: wrap; gap: 12px; }
  .search-wrap { width: 100%; order: 3; }
  .nav-tabs { order: 2; width: 100%; overflow-x: auto; }
  .hero-banner h1 { font-size: 26px; }
  .augment-grid { grid-template-columns: 1fr; }
  .tier-label { width: 44px; font-size: 18px; }
  .modal { width: 95%; max-height: 90vh; }
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

.hidden { display: none !important; }
</style>
</head>

function getDefaultBuild() {
  return {
    items:["根据对局情况灵活出装"],
    boots:"视情况选择",
    runes:{ primary:{ name:"精密", keystone:"征服者", slots:["凯旋","传说：韧性","致命一击"] }, secondary:{ name:"坚决", slots:["调节","过度生长"] } },
    skillOrder:"主Q副W，有R点R",
    augments:["根据阵容和发牌选择"]
  };
}

function renderTierList(filter) {
  const tiers = { 'S+':[], 'S':[], 'A':[], 'B':[], 'C':[] };
  champions.forEach(c => {
    if (filter && !c.name.includes(filter) && !c.title.includes(filter)) return;
    tiers[c.tier].push(c);
  });

  const grid = document.getElementById('tierGrid');
  grid.innerHTML = '';

  const tierLabels = { 'S+':'S+ 神级', 'S':'S 强势', 'A':'A 优秀', 'B':'B 一般', 'C':'C 弱势' };
  const tierClasses = { 'S+':'splus', 'S':'s', 'A':'a', 'B':'b', 'C':'c' };

  ['S+','S','A','B','C'].forEach(t => {
    if (tiers[t].length === 0) return;
    const row = document.createElement('div');
    row.className = 'tier-row';
    row.innerHTML = `<div class="tier-label ${tierClasses[t]}">${t}</div>`;
    const champWrap = document.createElement('div');
    champWrap.className = 'tier-champions';

    tiers[t].forEach(c => {
      const chip = document.createElement('div');
      chip.className = 'champion-chip';
      chip.innerHTML = `<div class="champ-icon" style="background:${c.color}20;color:${c.color}">${c.icon}</div><span class="champ-name">${c.name}</span><span class="champ-role">${c.role}</span><span class="champ-wr">${c.wr}</span>`;
      chip.addEventListener('click', () => openModal(c));
      champWrap.appendChild(chip);
    });

    row.appendChild(champWrap);
    grid.appendChild(row);
  });

  const total = champions.filter(c => !filter || c.name.includes(filter) || c.title.includes(filter)).length;
  document.getElementById('tierCount').textContent = `共 ${total} 位英雄 · 数据来源 arammayhem.com`;
}

function renderAugments() {
  const grid = document.getElementById('augmentGrid');
  grid.innerHTML = augments.map(a => `
    <div class="augment-card">
      <div class="augment-header">
        <div class="augment-icon ${a.tier}">⚙</div>
        <div>
          <div class="augment-name">${a.name}</div>
          <span class="augment-tier-badge ${a.tier}">${a.tierName}</span>
        </div>
      </div>
      <div class="augment-desc">${a.desc}</div>
      <div class="augment-heroes">
        ${a.heroes.map(h => `<span class="augment-hero-tag" data-hero="${h}">${h}</span>`).join('')}
      </div>
    </div>
  `).join('');

  grid.querySelectorAll('.augment-hero-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      const heroName = tag.dataset.hero;
      const champ = champions.find(c => c.name === heroName);
      if (champ) openModal(champ);
    });
  });
}

function renderTips() {
  document.getElementById('tipsGrid').innerHTML = tips.map(t => `
    <div class="tip-card">
      <h3>${t.title}</h3>
      <p>${t.content}</p>
    </div>
  `).join('');
}

function openModal(champ) {
  const build = champBuilds[champ.id] || getDefaultBuild();
  const overlay = document.getElementById('modalOverlay');
  const modal = document.getElementById('modal');

  modal.innerHTML = `
    <div class="modal-header">
      <div class="modal-champ-info">
        <div class="modal-champ-icon" style="background:${champ.color}20;color:${champ.color}">${champ.icon}</div>
        <div>
          <div class="modal-champ-name">${champ.name} <span style="font-size:14px;color:var(--tier-s)">[${champ.tier}]</span></div>
          <div class="modal-champ-title">${champ.title} · ${champ.role} · 胜率 ${champ.wr}</div>
        </div>
      </div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-section">
        <h3>🛒 推荐出装</h3>
        <div class="item-row">
          ${build.items.map(item => `<div class="item-slot">${item}</div>`).join('')}
          <div class="item-slot boots">${build.boots}</div>
        </div>
      </div>
      <div class="modal-section">
        <h3>📜 符文推荐</h3>
        <div class="rune-tree">
          <div class="rune-primary">
            <h4>主系：${build.runes.primary.name}</h4>
            <div class="rune-list">
              <div class="rune-item"><div class="rune-icon keystone">★</div>${build.runes.primary.keystone}</div>
              ${build.runes.primary.slots.map(s => `<div class="rune-item"><div class="rune-icon normal">○</div>${s}</div>`).join('')}
            </div>
          </div>
          <div class="rune-secondary">
            <h4>副系：${build.runes.secondary.name}</h4>
            <div class="rune-list">
              ${build.runes.secondary.slots.map(s => `<div class="rune-item"><div class="rune-icon normal">○</div>${s}</div>`).join('')}
            </div>
          </div>
        </div>
      </div>
      <div class="modal-section">
        <h3>⚡ 技能加点</h3>
        <div class="skill-order">${build.skillOrder}</div>
      </div>
      <div class="modal-section">
        <h3>🔧 推荐海克斯强化</h3>
        <div class="augment-recs">
          ${build.augments.map((a, i) => `
            <div class="augment-rec-item">
              <span class="rec-priority">P${i+1}</span>
              <span class="rec-name">${a}</span>
              <span class="rec-desc">${i===0?'首选':i===1?'次选':'备选'}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;

  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';

  document.getElementById('modalClose').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');

    const target = tab.dataset.tab;
    document.getElementById('section-tier').classList.toggle('hidden', target !== 'tier');
    document.getElementById('section-augments').classList.toggle('hidden', target !== 'augments');
    document.getElementById('section-tips').classList.toggle('hidden', target !== 'tips');
  });
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  const val = e.target.value.trim();
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('[data-tab="tier"]').classList.add('active');
  document.getElementById('section-tier').classList.remove('hidden');
  document.getElementById('section-augments').classList.add('hidden');
  document.getElementById('section-tips').classList.add('hidden');
  renderTierList(val);
});

renderTierList();
renderAugments();
renderTips();
</script>
